name: CI

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "Formula/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-formulas:
    name: Test formulas (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out tap
        uses: actions/checkout@v7

      - name: Add Homebrew to PATH on Linux
        if: runner.os == 'Linux'
        run: |
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"

      - name: Tap and trust local checkout
        run: |
          brew tap AspireOne/tap "$GITHUB_WORKSPACE"
          brew trust AspireOne/tap

      - name: Audit formulas
        run: |
          set -euo pipefail

          formulas=(Formula/*.rb)
          if [ ! -e "${formulas[0]}" ]; then
            echo "No formulas found in Formula/" >&2
            exit 1
          fi

          for formula_path in "${formulas[@]}"; do
            formula="$(basename "$formula_path" .rb)"
            brew audit --strict --online "AspireOne/tap/$formula"
          done

      - name: Install formulas from source
        run: |
          set -euo pipefail

          formulas=(Formula/*.rb)
          for formula_path in "${formulas[@]}"; do
            formula="$(basename "$formula_path" .rb)"
            brew install --build-from-source "AspireOne/tap/$formula"
          done

      - name: Test formulas
        run: |
          set -euo pipefail

          formulas=(Formula/*.rb)
          for formula_path in "${formulas[@]}"; do
            formula="$(basename "$formula_path" .rb)"
            brew test "AspireOne/tap/$formula"
          done
