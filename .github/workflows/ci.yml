name: CI

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "Formula/**"
      - ".github/workflows/**"
      - "scripts/**"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to test
        required: true
        type: string
      formula-artifact:
        description: Candidate formula from the calling workflow
        required: true
        type: string

permissions:
  contents: read

jobs:
  test-formulas:
    name: Test formulas (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out tap
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Download candidate formula
        if: inputs.formula-artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.formula-artifact }}
          path: Formula

      - name: Add Homebrew to PATH
        run: |
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          echo "/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"

      - name: Tap and trust local checkout
        run: |
          brew tap AspireOne/tap "$GITHUB_WORKSPACE"
          # Local Git clones omit the uncommitted candidate downloaded above.
          cp Formula/*.rb "$(brew --repository AspireOne/tap)/Formula/"
          brew trust AspireOne/tap

      - name: Audit formulas
        run: |
          set -euo pipefail

          formulas=(Formula/*.rb)
          if [ ! -e "${formulas[0]}" ]; then
            echo "No formulas found in Formula/" >&2
            exit 1
          fi

          for formula_path in "${formulas[@]}"; do
            formula="$(basename "$formula_path" .rb)"
            brew audit --strict --online "AspireOne/tap/$formula"
          done

      - name: Install formulas from source
        run: |
          set -euo pipefail

          formulas=(Formula/*.rb)
          for formula_path in "${formulas[@]}"; do
            formula="$(basename "$formula_path" .rb)"
            brew install --build-from-source "AspireOne/tap/$formula"
          done

      - name: Test formulas
        run: |
          set -euo pipefail

          formulas=(Formula/*.rb)
          for formula_path in "${formulas[@]}"; do
            formula="$(basename "$formula_path" .rb)"
            brew test "AspireOne/tap/$formula"
          done
